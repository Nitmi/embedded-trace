name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host-checks:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned development environment
        shell: bash
        run: |
          python -m pip install uv==0.11.7
          uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Host-only tests and lint
        shell: bash
        run: |
          uv run --frozen pytest -ra
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Build package
        run: uv build --out-dir dist
      - name: Check installed package without runtime dependencies
        env:
          TRACE_SMOKE_ROOT: ${{ runner.temp }}/embedded-trace-package
        run: python scripts/package_smoke.py --dist-dir dist --output-dir "$TRACE_SMOKE_ROOT"
        shell: bash
