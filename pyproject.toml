[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "embedded-trace"
version = "0.1.0"
description = "Offline, provenance-bound serial and RTT log timelines for embedded agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nitmi" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.11", "jsonschema>=4.23", "hatchling==1.32.4"]

[project.scripts]
embedded-trace = "embedded_trace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/embedded_trace"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "embedded_trace/schemas"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
